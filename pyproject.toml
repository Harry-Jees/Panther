[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panther-cli"
version = "1.0.0b0"
description = "Panther CLI — interactive local codebase Q&A and viva sessions"
authors = [
    {name = "Panther Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
extra = [
    "tiktoken>=0.7.0",
    "Pygments>=2.15",
]

[project.scripts]
panther = "panther.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["panther*"]
