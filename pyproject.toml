[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panther-cli"
version = "0.1.0"
description = "A local-first coding agent CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Panther" }]
license = { text = "ISC" }
dependencies = ["keyring>=25.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.0"]

[project.scripts]
panther = "panther.cli:main"

[tool.setuptools]
packages = ["panther"]

[tool.pytest.ini_options]
testpaths = ["tests"]
