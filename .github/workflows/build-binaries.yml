name: Build Executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            arch: x64
            artifact-pattern: dist/*.zip
          - os: macos-latest
            os-name: macOS
            arch: arm64
            artifact-pattern: dist/*.tar.gz
          - os: macos-13
            os-name: macOS
            arch: x64
            artifact-pattern: dist/*.tar.gz
          - os: ubuntu-latest
            os-name: Linux
            arch: x64
            artifact-pattern: dist/*.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]

      - name: Build standalone binary
        run: python scripts/build_executable.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: panther-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error
